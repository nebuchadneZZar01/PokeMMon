[project]
name = "pokemmon"
version = "0.1.0"
description = "Pokémon 1st-gen battle simulator with MiniMax AI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.4",
    "rich>=13.9.0",
    "langgraph>=0.4.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-ollama>=0.2.0",
    "ollama>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "PERF", "RUF", "C4", "RET", "PT"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"app/data/*" = ["E501"]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
strict_optional = true
disallow_untyped_defs = true

[tool.coverage.run]
omit = [
    "app/schemas/strategy.py",
]

[tool.coverage.report]
fail_under = 90

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.0.3",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.15",
]
